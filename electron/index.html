<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui,sans-serif;margin:0;padding:24px;color:#061b31}
h1{font-weight:300}input{width:100%;padding:10px;border:1px solid #e5edf5;border-radius:4px}
button{background:#533afd;color:#fff;border:0;padding:10px 16px;border-radius:4px;margin-top:12px;cursor:pointer}
.note{font-size:12px;color:#64748d;margin-top:12px}
</style></head><body>
<h1>SwitchClaude</h1>
<p>Switch Claude accounts in 2 seconds.</p>
<label>License key</label>
<input id="k" placeholder="CLAUDE-SWITCHER-XXXX-XXXX">
<button onclick="save()">Activate</button>
<div class="note">1 account free. Extra accounts $9.99 one-time at switchclaude.com.<br>No subscription. Cached 7 days for offline use.</div>
<script>
async function save(){
  const key=document.getElementById('k').value.trim();
  const r=await fetch('https://switchclaude.com/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
  const j=await r.json();
  alert(j.valid?'License valid — extra accounts unlocked.':'Invalid key.');
}
window.api?.onFocusLicense(()=>document.getElementById('k').focus());
</script>
</body></html>
